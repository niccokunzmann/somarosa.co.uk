{{ define "main" }}
<style>
  .blog-grid-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  .blog-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; list-style: none; margin: 2rem 0 0; padding: 0; }
  @media (min-width: 768px)  { .blog-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .blog-grid { grid-template-columns: repeat(3, 1fr); } }
  .blog-card { margin: 0; padding: 0; }
  .blog-card a { display: block; text-decoration: none; color: inherit; }
  .blog-card-img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; background: rgba(128,128,128,0.15); }
  .blog-card-title { margin: 0.9rem 0 0; font-size: 1.25rem; line-height: 1.3; }
  .blog-card a:hover .blog-card-title, .blog-card a:focus .blog-card-title { text-decoration: underline; }
  .blog-pagination { margin-top: 3rem; text-align: center; }
</style>

<div class="blog-grid-wrap">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div>{{ . }}</div>{{ end }}

  {{ $paginator := .Paginate (.Pages.ByDate.Reverse) 9 }}
  <ul class="blog-grid">
    {{ range $paginator.Pages }}
    <li class="blog-card">
      <a href="{{ .RelPermalink }}">
        <img class="blog-card-img"
             src="{{ .Params.image | default "/img/link-preview.png" | relURL }}"
             alt="{{ .Params.image_alt | default .Title }}"
             loading="lazy">
        <h2 class="blog-card-title">{{ .Title }}</h2>
      </a>
    </li>
    {{ end }}
  </ul>

  {{ if gt $paginator.TotalPages 1 }}
  <nav class="blog-pagination" aria-label="Blog pages">
    {{ template "_internal/pagination.html" . }}
  </nav>
  {{ end }}
</div>
{{ end }}
