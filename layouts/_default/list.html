{{ define "main" }}

{{ if .Params.full_width }}

  {{ .Content }}

{{ else }}

  <main class="container mx-auto px-6 py-16">

    {{ if .IsSection }}

      {{ if not .Params.hide_page_title }}
        <h1 class="text-4xl font-bold mb-6">{{ .Title }}</h1>
      {{ end }}

      <ul class="space-y-4">
        {{ range .Pages }}
          <li>
            <a href="{{ .RelPermalink }}" class="text-lg underline">
              {{ .Title }}
            </a>
          </li>
        {{ end }}
      </ul>

    {{ else }}

      {{ .Content }}

    {{ end }}

  </main>

{{ end }}

{{ end }}
