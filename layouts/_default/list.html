{{ define "main" }}
<main class="container mx-auto px-6 py-16">
  <h1 class="text-4xl font-bold mb-6">{{ .Title }}</h1>

  <ul class="space-y-4">
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}" class="text-lg underline">
          {{ .Title }}
        </a>
      </li>
    {{ end }}
  </ul>
</main>
{{ end }}
