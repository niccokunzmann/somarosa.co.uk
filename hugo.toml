############################
# Site Configuration
############################

baseURL = "https://somarosa.co.uk/"
title = "Somarosa"
author = "Anya Walsh"
languageCode = "en"
defaultContentLanguage = "en"

theme = "tella"

enableRobotsTXT = true
canonifyURLs = true
relativeURLs = false
enableInlineShortcodes = false


############################
# Build
############################

# Hugo will output to /public (required for GitHub Pages workflow)
# DO NOT set publishDir


############################
# Params
############################

[params]
showBlog = false
mainSections = ["pages"]
googleFonts = false


############################
# Logo
############################

[params.logo]
main = "img/logo/logo.svg"
alt = "Anya Walsh"
size = "h-14"


############################
# Site Name
############################

[params.site]
name = "Anya Walsh"


############################
# Icons
############################

[params.icon]
fontawesome = true


############################
# SEO / Meta
############################

[params.homepage_meta_tags]
meta_description = "Anya Walsh – Temple Priestess, Sacred Sexuality, Somatic Embodiment & Women's Work facilitator, Vocal Star Reiki Healer, Yoga Teacher, Ceremonial Dancer, Vocalist and Artist"
meta_og_title = "Somarosa"
meta_og_type = "website"
meta_og_url = "https://somarosa.co.uk/"
meta_og_image = "https://somarosa.co.uk/img/link-preview.png"
meta_og_description = "Anya Walsh – Feminine Embodiment & Somatic Vitality Coach, Temple Priestess, Sacred Sexuality, BioDevelopment Dance Teacher, Yoga Teacher, Pranayama, Yoga Nidra Teacher."
meta_twitter_card = "summary_large_image"
meta_twitter_site = "@somarosa"
meta_twitter_creator = "@somarosa"


